name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages (FFmpeg and libsndfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1

      - name: Install dependencies
        run: |
          uv sync --extra dev
          uv pip install torch torchaudio torchvision --index-url https://download.pytorch.org/whl/cpu
          uv pip install silero-vad faster-whisper

      - name: Run Ruff Linter
        run: |
          uv run ruff check .

      - name: Run Pytest Suite
        run: |
          uv run pytest -v tests/unit/
