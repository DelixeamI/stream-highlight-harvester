[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "narezka"
version = "0.1.0"
description = "Local AI highlight finder and clip generator for game stream VODs with Russian speech"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Narezka Team" }
]
dependencies = [
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "psutil>=5.9.0",
    "pyloudnorm>=0.2.0",
    "jinja2>=3.1.0",
    "httpx>=0.28.0",
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    "opencv-python>=4.10.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "soundfile>=0.12.0",
    "av>=12.0.0",
    "librosa>=1.0.0",
    "jiwer>=3.0.0",
    "rapidfuzz>=3.0.0",
    "tqdm>=4.66.0",
    "onnxruntime>=1.19.0",
    "faster-whisper>=1.0.0",
    "silero-vad>=5.1.0",
    "demucs>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.0",
    "pyright>=1.1.390",
    "httpx>=0.28.0",
]
gpu = [
    "torch>=2.7.0",
    "torchaudio>=2.7.0",
    "torchvision>=0.22.0",
]

[project.scripts]
narezka = "narezka.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/narezka"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # function calls in argument defaults (idiomatic for Typer CLI)
]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
pythonPlatform = "Windows"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: tests that require a physical NVIDIA GPU",
    "slow: tests that take significant time to execute",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
